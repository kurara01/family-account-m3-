<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭账户 · 落地介绍页</title>
<link rel="stylesheet" href="common.css">
<style>
  .poster-section {
    margin: var(--sp-md); border-radius: var(--radius-lg); overflow: hidden;
    background: linear-gradient(180deg, #FFFFFF 0%, #F4F1EC 100%); position: relative;
  }
  .poster-img {
    width: 100%; height: 420px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .poster-placeholder-tag {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.06); color: var(--color-placeholder);
    font-size: 10px; padding: 2px 8px; border-radius: var(--radius-full);
    pointer-events: none;
  }
  .poster-content { text-align: center; color: var(--color-title); }
  .poster-icon { font-size: 72px; margin-bottom: var(--sp-md); }
  .poster-title { font-size: 22px; font-weight: 700; margin-bottom: var(--sp-xs); }
  .poster-sub { font-size: var(--fs-sm); color: var(--color-secondary); }

  .agreement-section {
    padding: var(--sp-sm) var(--sp-md);
    display: flex; align-items: center; gap: var(--sp-xs);
    font-size: var(--fs-sm); color: var(--color-secondary);
  }
  .agreement-section input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer;
  }
  .agreement-link { color: var(--color-title); font-weight: 500; text-decoration: underline; cursor: pointer; }

  .bottom-action {
    padding: var(--sp-md); background: var(--color-white);
    border-top: 0.5px solid var(--color-divider);
    position: sticky; bottom: 0;
  }

  /* 家庭头像上传 */
  .family-avatar-upload {
    display: flex; align-items: center; gap: var(--sp-sm);
    margin: var(--sp-md); padding: var(--sp-md);
    background: var(--color-white); border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
  }
  .family-avatar-preview {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--color-warm-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0; overflow: hidden;
  }
  .family-avatar-upload-btn {
    flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-xs);
  }
  .family-name-input {
    border: none; border-bottom: 1px solid var(--color-divider);
    font-size: var(--fs-md); font-weight: 600;
    padding: var(--sp-xs) 0; outline: none; width: 120px;
    font-family: var(--font-cn);
  }
  .family-name-input:focus { border-color: var(--color-primary); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="navbar">
    <button class="navbar-back" onclick="history.back()">←</button>
    <div class="navbar-title">创建家庭</div>
  </div>

  <div class="page-content">

    <div class="poster-section">
      <div class="poster-placeholder-tag">运营海报位</div>
      <div class="poster-img">
        <div class="poster-content">
          <div class="poster-icon" title="运营可配置">🏠</div>
          <div class="poster-title" title="运营可配置">九木家庭账户</div>
          <div class="poster-sub" title="运营可配置">家庭账户全家共享 · 到店出示家庭码</div>
        </div>
      </div>
    </div>

    <!-- 家庭信息设置 -->
    <div class="family-avatar-upload">
      <div class="family-avatar-preview" id="familyAvatarPreview">📷</div>
      <div class="family-avatar-upload-btn">
        <div style="font-size:var(--fs-sm);color:var(--color-secondary);width:100%;">家庭名称</div>
        <input class="family-name-input" id="familyNameInput" value="快乐一家" maxlength="20" placeholder="给家庭起个名字">
        <div style="font-size:var(--fs-xs);color:var(--color-placeholder);">可点击上传家庭头像</div>
      </div>
    </div>

    <!-- 协议勾选 -->
    <div class="agreement-section">
      <input type="checkbox" id="agreeCheck">
      <label for="agreeCheck" style="cursor:pointer;">我已阅读并同意</label>
      <span class="agreement-link" onclick="showAgreement()">《家庭账户协议》</span>
    </div>

  </div>

  <div class="bottom-action">
    <button class="btn btn-primary btn-block" id="createBtn" onclick="handleCreate()" disabled>创建家庭组</button>
  </div>
</div>

<script>
document.getElementById('agreeCheck').addEventListener('change', function() {
  document.getElementById('createBtn').disabled = !this.checked;
});

// 家庭头像点击
document.getElementById('familyAvatarPreview').addEventListener('click', function() {
  this.textContent = '🏠';
  this.style.background = 'var(--color-primary)';
  this.style.color = 'var(--color-white)';
});

function showAgreement() {
  window.open('family-rules.html', '_blank');
}

function handleCreate() {
  if (!document.getElementById('agreeCheck').checked) {
    alert('请先勾选同意《家庭账户协议》');
    return;
  }
  window.location.href = 'dashboard.html';
}
</script>

</body>
</html>
