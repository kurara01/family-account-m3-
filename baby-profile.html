<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝贝档案</title>
<link rel="stylesheet" href="common.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F5F2EE;
  font-family: var(--font-cn);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 20px 0;
}
.phone-frame {
  width: 375px; min-height: 812px;
  background: #F5F2EE; border-radius: 20px;
  overflow: hidden; box-shadow: 0 8px 34px rgba(0,0,0,0.14);
  position: relative; display: flex; flex-direction: column;
}

/* 导航栏 */
.navbar {
  height: 48px; display: flex; align-items: center;
  justify-content: center; position: relative; padding: 0 16px;
  background: #fff; flex-shrink: 0;
}
.navbar-back {
  position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: none; font-size: 22px; cursor: pointer;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  color: #111;
}
.navbar-title { font-size: 16px; font-weight: 700; color: #111; }
.navbar-right {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 4px;
}
.navbar-right span {
  width: 22px; height: 22px; border-radius: 4px;
  background: #111; color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 10px; opacity: 0.9;
}

/* 内容区 */
.page-content { flex: 1; overflow-y: auto; }

/* ===== 空状态 ===== */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 24px; text-align: center;
  flex: 1;
}
.empty-illustration {
  width: 140px; height: 140px; margin-bottom: 20px;
  background: #E8E1D8; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px;
}
.empty-title {
  font-size: 18px; font-weight: 700; color: #111; margin-bottom: 8px;
}
.empty-desc {
  font-size: 14px; color: #999; margin-bottom: 28px; line-height: 1.5;
}

/* 底部按钮区域 */
.bottom-action {
  padding: 16px 20px 24px; background: #fff; flex-shrink: 0;
}
.btn-primary {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; width: 100%; height: 46px;
  border: none; border-radius: 99px;
  background: #6B4C3B; color: #fff;
  font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: var(--font-cn);
}
.btn-primary:active { opacity: 0.85; }

/* ===== 宝贝列表（已有宝贝时） ===== */
.baby-list { padding: 16px; display: none; }
.baby-list.show { display: block; }

.baby-card {
  background: #fff; border-radius: 14px; overflow: hidden;
  margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.baby-card-header {
  display: flex; align-items: center; padding: 16px;
  position: relative;
}
.baby-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-right: 14px; flex-shrink: 0;
}
.baby-avatar.boy { background: #D6E8F5; }
.baby-avatar.girl { background: #FDE6E6; }
.baby-info { flex: 1; min-width: 0; }
.baby-name { font-size: 16px; font-weight: 700; color: #111; }
.baby-meta { font-size: 12px; color: #999; margin-top: 2px; display: flex; gap: 10px; }
.baby-tags {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
}
.baby-tag {
  padding: 2px 8px; border-radius: 99px;
  background: #F2EFEA; color: #666; font-size: 10px;
}
.baby-actions {
  position: absolute; right: 16px; top: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: none; cursor: pointer;
  font-size: 16px; color: #bbb; display: flex; align-items: center; justify-content: center;
}
.baby-actions:active { background: #f0f0f0; }

/* ===== 宝贝档案说明 ===== */
.baby-notes {
  margin: 12px 16px 20px;
  background: #FBF9F6;
  border: 1px solid #F0EAE2;
  border-radius: 12px;
  padding: 14px 16px;
}
.baby-notes-title {
  font-size: 13px; font-weight: 700; color: #111; margin-bottom: 8px;
}
.baby-notes p {
  font-size: 12px; color: #999; line-height: 1.6; margin-bottom: 6px;
}
.baby-notes p:last-child { margin-bottom: 0; }
.baby-notes ul {
  padding-left: 18px; margin-bottom: 6px;
}
.baby-notes li {
  font-size: 12px; color: #999; line-height: 1.6;
}
</style>
</head>
<body>

<div class="phone-frame">

  <!-- 导航栏 -->
  <div class="navbar">
    <button class="navbar-back" onclick="history.back()">←</button>
    <div class="navbar-title">宝贝档案</div>
    <div class="navbar-right">
      <span>⋯</span>
      <span>−</span>
      <span>○</span>
    </div>
  </div>

  <div class="page-content">

    <!-- ===== 空状态（默认显示） ===== -->
    <div class="empty-state" id="emptyState">
      <div class="empty-illustration">👶</div>
      <div class="empty-title">暂无宝贝信息</div>
      <div class="empty-desc">添加宝贝档案，获取生日专属礼遇<br>和分年龄段商品推荐</div>
      <button class="btn-primary" onclick="goToAdd()">✚ 添加宝贝</button>
    </div>

    <!-- ===== 宝贝列表（有宝贝时） ===== -->
    <div class="baby-list show" id="babyList">

      <!-- 已有的宝贝卡片 -->
      <div class="baby-card">
        <div class="baby-card-header">
          <div class="baby-avatar boy">👦</div>
          <div class="baby-info">
            <div class="baby-name">小宝</div>
            <div class="baby-meta">
              <span>👦 儿子</span>
              <span>🎂 2019-08-15（7岁）</span>
            </div>
            <div class="baby-tags">
              <span class="baby-tag">积木拼搭</span>
              <span class="baby-tag">毛绒玩具</span>
              <span class="baby-tag">动漫IP</span>
            </div>
          </div>
          <button class="baby-actions" onclick="alert('编辑/删除宝贝')">⋯</button>
        </div>
      </div>

      <div class="baby-card">
        <div class="baby-card-header">
          <div class="baby-avatar girl">👧</div>
          <div class="baby-info">
            <div class="baby-name">小花</div>
            <div class="baby-meta">
              <span>👧 女儿</span>
              <span>🎂 2021-03-22（5岁）</span>
            </div>
            <div class="baby-tags">
              <span class="baby-tag">娃娃玩具</span>
              <span class="baby-tag">早教玩具</span>
              <span class="baby-tag">粉色系</span>
            </div>
          </div>
          <button class="baby-actions" onclick="alert('编辑/删除宝贝')">⋯</button>
        </div>
      </div>

      <!-- 添加更多 -->
      <div style="text-align:center;padding:12px 0 4px;">
        <button class="btn-primary" style="display:inline-flex;width:auto;padding:0 24px;height:38px;font-size:14px;" onclick="goToAdd()">✚ 再添一位宝贝</button>
      </div>

      <!-- 宝贝档案说明 -->
      <div class="baby-notes">
        <div class="baby-notes-title">💡 宝贝档案说明</div>
        <p>宝贝档案用于记录孩子的生日和喜好，添加后可享受：</p>
        <ul>
          <li>生日专属礼遇，到店出示家庭码即可领取</li>
          <li>分年龄段商品推荐，匹配孩子喜好</li>
        </ul>
        <p>档案信息仅用于家庭账户个性化服务，我们将严格保护孩子的个人信息。</p>
      </div>
    </div>

  </div>

</div>

<script>
// Demo: 演示从空状态到有宝贝的切换
// 实际使用时根据数据判断显示 emptyState 或 babyList
let hasBaby = true; // 切到 false 看空态

function goToAdd() {
  window.location.href = 'baby-add.html';
}

// 页面加载时根据状态显示
window.onload = function() {
  if (hasBaby) {
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('babyList').classList.add('show');
  } else {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('babyList').classList.remove('show');
  }
};
</script>

</body>
</html>
