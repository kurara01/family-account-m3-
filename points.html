<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭账户 · 家庭积分</title>
<link rel="stylesheet" href="common.css">
<style>
  .nav-right { display:flex;align-items:center;gap:var(--sp-xs);position:absolute;right:var(--sp-md);top:50%;transform:translateY(-50%); }
  .nav-right span { font-size:18px;cursor:pointer;color:var(--color-title); }

  .points-header { padding:28px 16px 20px;background:var(--color-white);text-align:center; }
  .points-header-label { font-size:12px;color:#999;margin-bottom:6px; }
  .points-header-amount { font-family:var(--font-num);font-size:52px;font-weight:700;color:var(--color-title);line-height:1; }
  .points-actions { display:flex;align-items:center;justify-content:center;gap:20px;margin-top:12px; }
  .points-actions .btn-ex { height:34px;padding:0 22px;font-size:13px;font-weight:600;border-radius:999px;background:var(--color-title);color:var(--color-white);border:none;cursor:pointer; }
  .points-actions .btn-ex:active { opacity:0.8; }
  .points-rules { font-size:13px;color:#999;cursor:pointer; }

  .tab-bar { display:flex;background:var(--color-white);border-bottom:0.5px solid #eee; }
  .tab-item { flex:1;text-align:center;padding:12px 0;font-size:14px;color:#999;cursor:pointer;position:relative; }
  .tab-item.active { color:var(--color-title);font-weight:600; }
  .tab-item.active::after { content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:28px;height:2.5px;background:var(--color-title);border-radius:1px; }

  .points-list { background:var(--color-white); }
  .points-row { display:flex;align-items:center;padding:12px 16px;border-bottom:0.5px solid #f0f0f0; }
  .points-row:last-child { border-bottom:none; }
  .points-row-info { flex:1;min-width:0; }
  .points-row-type { font-size:14px;color:var(--color-title); }
  .points-row-date { font-size:11px;color:#bbb;margin-top:2px; }
  .points-row-amount { font-family:var(--font-num);font-weight:700;font-size:15px;flex-shrink:0; }
  .points-row-amount.positive { color:var(--color-title); }
  .points-row-amount.positive-red { color:#E74C3C; }
  .points-row-amount.negative { color:#bbb; }

  .empty-state { padding:60px 16px;text-align:center;color:#bbb; }
  .empty-state .empty-icon { font-size:48px;margin-bottom:12px;opacity:0.4; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="navbar" style="position:relative;">
    <button class="navbar-back" onclick="history.back()">←</button>
    <div class="navbar-title">家庭积分</div>
    <div class="nav-right">
      <span>⋯</span>
      <span>⭕</span>
    </div>
  </div>

  <div class="page-content" style="background:var(--color-white);">

    <div class="points-header">
      <div class="points-header-label">当前家庭积分</div>
      <div class="points-header-amount">1,280</div>
      <div class="points-actions">
        <button class="btn-ex" onclick="window.location.href='points-mall.html'">兑换</button>
        <span class="points-rules" onclick="window.open('family-rules.html','_blank')">规则</span>
      </div>
    </div>

    <div class="tab-bar">
      <span class="tab-item active" onclick="switchTab(this)">积分明细</span>
      <span class="tab-item" onclick="switchTab(this)">兑换记录</span>
    </div>

    <div class="points-list">
      <div class="points-row">
        <div class="points-row-info">
          <div class="points-row-type">消费得积分</div>
          <div class="points-row-date">2026-07-06 14:32</div>
        </div>
        <div class="points-row-amount positive">+60</div>
      </div>

      <div class="points-row">
        <div class="points-row-info">
          <div class="points-row-type">兑换优惠券</div>
          <div class="points-row-date">2026-07-05 23:57</div>
        </div>
        <div class="points-row-amount negative">-100</div>
      </div>

      <div class="points-row">
        <div class="points-row-info">
          <div class="points-row-type">消费得积分</div>
          <div class="points-row-date">2026-06-13 10:15</div>
        </div>
        <div class="points-row-amount positive">+24</div>
      </div>

      <div class="points-row">
        <div class="points-row-info">
          <div class="points-row-type">消费得积分</div>
          <div class="points-row-date">2026-06-12 16:08</div>
        </div>
        <div class="points-row-amount positive">+45</div>
      </div>

      <div class="points-row">
        <div class="points-row-info">
          <div class="points-row-type">后台手动</div>
          <div class="points-row-date">2026-05-18 18:05</div>
        </div>
        <div class="points-row-amount positive-red">+20,000</div>
      </div>
    </div>

    <div class="empty-state" style="display:none;">
      <div class="empty-icon">📋</div>
      <div>暂无积分记录</div>
    </div>

  </div>
</div>

<script>
function switchTab(el) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>

</body>
</html>
